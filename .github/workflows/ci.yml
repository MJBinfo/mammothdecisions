name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-html-script.mjs
